name: 🧩 Container Hardening Orchestrator

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name triggering this pipeline"
        required: true
        type: string
      base_image:
        description: "Base OS image (ubuntu | rhel | amazonlinux)"
        required: true
        type: string

jobs:
  build:
    name: 🏗️ Build Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator

      - name: Verify checkout structure
        run: |
          pwd
          ls -R ..

      - name: Run Build Action
        uses: ../_orchestrator/actions/build

  scan_image:
    name: 🔍 Scan Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Scan Image
        uses: ../_orchestrator/actions/scan-image

  scan_code:
    name: 🧪 Code Scan
    runs-on: ubuntu-latest
    needs: scan_image
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Scan Code
        uses: ../_orchestrator/actions/scan-code

  hardening_check:
    name: 🧰 Hardening Check
    runs-on: ubuntu-latest
    needs: scan_code
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Hardening Check
        uses: ../_orchestrator/actions/hardening-check

  sign_attest:
    name: 🔏 Sign & Attest
    runs-on: ubuntu-latest
    needs: hardening_check
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Sign & Attest
        uses: ../_orchestrator/actions/sign-attest

  generate_report:
    name: 🧾 Generate Report
    runs-on: ubuntu-latest
    needs: sign_attest
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Generate Report
        uses: ../_orchestrator/actions/generate-report

  notify_issue:
    name: 📣 Notify GitHub Issue
    runs-on: ubuntu-latest
    needs: generate_report
    steps:
      - name: Checkout orchestrator repo
        uses: actions/checkout@v4
        with:
          repository: enterprise-hardening-lab/container-hardening-orchestrator
          ref: main
          path: _orchestrator
      - name: Run Notify Issue
        uses: ../_orchestrator/actions/notify-issue
