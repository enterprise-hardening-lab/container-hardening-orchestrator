name: 🧩 Container Hardening Orchestrator

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      base_image:
        required: true
        type: string

jobs:
  build:
    name: 🏗️ Build Container Image
    uses: ./actions/build/action.yml

  scan_image:
    name: 🔍 Scan Image
    needs: build
    uses: ./actions/scan-image/action.yml

  scan_code:
    name: 🧪 Code Scan
    needs: scan_image
    uses: ./actions/scan-code/action.yml

  hardening_check:
    name: 🧰 Hardening Check
    needs: scan_code
    uses: ./actions/hardening-check/action.yml

  sign_attest:
    name: 🔏 Sign & Attest
    needs: hardening_check
    uses: ./actions/sign-attest/action.yml

  generate_report:
    name: 🧾 Generate HTML Report
    needs: sign_attest
    uses: ./actions/generate-report/action.yml

  notify_issue:
    name: 📣 Notify via GitHub Issue
    needs: generate_report
    uses: ./actions/notify-issue/action.yml
