name: 🧩 Container Hardening Orchestrator

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name triggering this pipeline"
        required: true
        type: string
      base_image:
        description: "Base OS image (ubuntu | rhel | amazonlinux)"
        required: true
        type: string
    secrets:
      personal_token:
        description: "GitHub Personal Access Token"
        required: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build:
    name: 🏗️ Build Container Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run Build Stage
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/build@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}
          role-to-assume: arn:aws:iam::661539128717:role/GitHubOIDC-ECRPushRole
          aws-region: ap-south-1

      # ✅ Save built image for later reuse
      - name: 🐳 Save built image as artifact
        run: |
          echo "Saving image ${{ inputs.app_name }}:${{ github.sha }} to image.tar..."
          docker save ${{ inputs.app_name }}:${{ github.sha }} -o image.tar

      # 🧹 Delete existing artifact (avoid 409 Conflict)
      - name: 🧹 Delete old artifact if exists
        run: |
          echo "Checking for existing 'built-image' artifact..."
          artifacts=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].name')
          if echo "$artifacts" | grep -q "^built-image$"; then
            echo "Existing artifact found. Deleting..."
            id=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[] | select(.name==\"built-image\") | .id')
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id
          else
            echo "No old artifact found."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.personal_token }}

      - name: 📦 Upload built image artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: image.tar

  scan_image:
    name: 🔍 Scan Image (Local)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ⬇️ Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: 🐳 Load image for scanning
        run: |
          echo "Loading image for scanning..."
          docker load -i image.tar
          docker images

      - name: Run Image Scan
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/scan-image@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}

  scan_code:
    name: 🧪 Code Scan
    runs-on: ubuntu-latest
    needs: scan_image
    steps:
      - name: Run Code Scan
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/scan-code@main
        with:
          app_name: ${{ inputs.app_name }}

  hardening_check:
    name: 🧰 Hardening Check
    runs-on: ubuntu-latest
    needs: scan_code
    steps:
      - name: ⬇️ Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: 🐳 Load image before hardening validation
        run: |
          echo "Loading image for hardening checks..."
          docker load -i image.tar
          docker images

      - name: Run Hardening Check
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/hardening-check@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}

  sign_attest:
    name: 🔏 Sign & Attest
    runs-on: ubuntu-latest
    needs: hardening_check
    steps:
      - name: Run Sign & Attest
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/sign-attest@main
        with:
          app_name: ${{ inputs.app_name }}

  generate_report:
    name: 🧾 Generate HTML Report
    runs-on: ubuntu-latest
    needs: sign_attest
    steps:
      - name: Run Generate Report
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/generate-report@main
        with:
          app_name: ${{ inputs.app_name }}

  notify_issue:
    name: 📣 Notify GitHub Issue
    runs-on: ubuntu-latest
    needs: generate_report
    permissions:
      contents: read
      issues: write
    steps:
      - name: Run Notify Issue
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/notify-issue@main
        with:
          app_name: ${{ inputs.app_name }}
          personal_token: ${{ secrets.personal_token }}

  promote_image:
    name: 🚀 Promote Verified Image to Hardened ECR
    runs-on: ubuntu-latest
    needs: notify_issue
    if: success()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: ⬇️ Download built image artifact
        uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: 🐳 Load image before push
        run: |
          echo "Loading verified image before push..."
          docker load -i image.tar
          docker images

      - name: Run Promote Image
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/promote-image@main
        with:
          app_name: ${{ inputs.app_name }}
          role-to-assume: arn:aws:iam::661539128717:role/GitHubOIDC-ECRPushRole
          aws-region: ap-south-1
          trivy_summary: reports/generated/trivy-scan.json
          semgrep_summary: reports/generated/semgrep-report.sarif
          max_critical: 0
          max_high: 5
