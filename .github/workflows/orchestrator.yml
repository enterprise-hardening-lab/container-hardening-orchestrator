name: 🧩 Container Hardening Orchestrator

on:
  workflow_call:
    inputs:
      app_name:
        description: "Application name triggering this pipeline"
        required: true
        type: string
      base_image:
        description: "Base OS image (ubuntu | rhel | amazonlinux)"
        required: true
        type: string
    secrets:
      personal_token:
        description: "GitHub Personal Access Token"
        required: true

permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build:
    name: 🏗️ Build Container Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run Build Stage
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/build@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}
          role-to-assume: arn:aws:iam::661539128717:role/GitHubOIDC-ECRPushRole
          aws-region: ap-south-1

  scan_image:
    name: 🔍 Scan Image (Local)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Run Image Scan
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/scan-image@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}

  scan_code:
    name: 🧪 Code Scan
    runs-on: ubuntu-latest
    needs: scan_image
    steps:
      - name: Run Code Scan
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/scan-code@main
        with:
          app_name: ${{ inputs.app_name }}

  hardening_check:
    name: 🧰 Hardening Check
    runs-on: ubuntu-latest
    needs: scan_code
    steps:
      - name: Run Hardening Check
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/hardening-check@main
        with:
          app_name: ${{ inputs.app_name }}
          base_image: ${{ inputs.base_image }}

  sign_attest:
    name: 🔏 Sign & Attest
    runs-on: ubuntu-latest
    needs: hardening_check
    steps:
      - name: Run Sign & Attest
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/sign-attest@main
        with:
          app_name: ${{ inputs.app_name }}

  generate_report:
    name: 🧾 Generate HTML Report
    runs-on: ubuntu-latest
    needs: sign_attest
    steps:
      - name: Run Generate Report
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/generate-report@main
        with:
          app_name: ${{ inputs.app_name }}

  notify_issue:
    name: 📣 Notify GitHub Issue
    runs-on: ubuntu-latest
    needs: generate_report
    permissions:
      contents: read
      issues: write
    steps:
      - name: Run Notify Issue
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/notify-issue@main
        with:
          app_name: ${{ inputs.app_name }}
          personal_token: ${{ secrets.personal_token }}   # ✅ Correct: use secret passed from caller

  promote_image:
    name: 🚀 Promote Verified Image to Hardened ECR
    runs-on: ubuntu-latest
    needs: notify_issue
    if: success()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Run Promote Image
        uses: enterprise-hardening-lab/container-hardening-orchestrator/actions/promote-image@main
        with:
          app_name: ${{ inputs.app_name }}
          role-to-assume: arn:aws:iam::661539128717:role/GitHubOIDC-ECRPushRole
          aws-region: ap-south-1
          trivy_summary: reports/generated/trivy-scan.json
          semgrep_summary: reports/generated/semgrep-report.sarif
          max_critical: 0
          max_high: 5
