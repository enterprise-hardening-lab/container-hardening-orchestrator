name: Scan Container Image
description: Perform vulnerability scan using Trivy on the built image artifact

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base image type (ubuntu | rhel | amazonlinux)"
    required: true

runs:
  using: "composite"
  steps:
    - name: 📥 Download built image artifact
      uses: actions/download-artifact@v4
      with:
        name: built-image
        path: reports/generated

    - name: 📂 Load Docker image
      shell: bash
      run: |
        echo "📦 Loading image into local Docker daemon..."
        IMAGE_TAR="reports/generated/image.tar"

        if [ ! -f "$IMAGE_TAR" ]; then
          echo "❌ ERROR: Built image artifact not found at $IMAGE_TAR"
          echo "📂 Listing downloaded files for debug:"
          ls -R reports/generated || true
          exit 1
        fi

        docker load -i "$IMAGE_TAR"
        echo "✅ Docker image loaded successfully:"
        docker images | grep "${{ inputs.app_name }}" || echo "⚠️ Warning: image tag not found, but load succeeded."

    - name: 📦 Install Trivy
      shell: bash
      run: |
        echo "📦 Installing Trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin
        echo "✅ Trivy installed successfully."
        trivy --version

    - name: 🚀 Run Trivy scan
      shell: bash
      run: |
        echo "🚀 Running Trivy vulnerability scan on loaded image..."
        mkdir -p reports/generated
        IMAGE="${{ inputs.app_name }}:${GITHUB_SHA}"
        echo "🔍 Scanning image: $IMAGE"
        trivy image --severity HIGH,CRITICAL \
          --format json \
          --output reports/generated/trivy-scan.json "$IMAGE"
        echo "✅ Scan completed: reports/generated/trivy-scan.json"
        ls -lh reports/generated/trivy-scan.json

    - name: 📤 Upload Trivy report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-scan-report
        path: reports/generated/trivy-scan.json
