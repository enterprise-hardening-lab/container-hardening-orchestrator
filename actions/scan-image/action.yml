name: Scan Container Image
description: Perform local vulnerability scan using Trivy on the freshly built image.

inputs:
  app_name:
    description: "Application name (for tagging and reporting)"
    required: true
  base_image:
    description: "Base OS image used for the container build (ubuntu | rhel | amazonlinux)"
    required: true

runs:
  using: "composite"
  steps:
    - name: 📦 Install Trivy
      shell: bash
      run: |
        echo "📦 Installing Trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

    - name: 🚀 Run Trivy Image Scan
      shell: bash
      run: |
        mkdir -p reports/generated
        IMAGE="${{ inputs.app_name }}:${GITHUB_SHA}"

        echo "🔍 Checking for local image..."
        if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
          echo "❌ Local image $IMAGE not found."
          exit 1
        fi

        echo "🚀 Running Trivy vulnerability scan on $IMAGE"
        trivy image --severity HIGH,CRITICAL --format json --output reports/generated/trivy-scan.json "$IMAGE"
        trivy image --severity HIGH,CRITICAL --format table --output reports/generated/trivy-scan.txt "$IMAGE"

        # Optional: Generate HTML summary
        if command -v jq >/dev/null 2>&1; then
          echo "🧩 Creating HTML summary..."
          jq -r '.Results[]?.Vulnerabilities[]? | "<tr><td>\(.VulnerabilityID)</td><td>\(.PkgName)</td><td>\(.InstalledVersion)</td><td>\(.Severity)</td></tr>"' reports/generated/trivy-scan.json \
            | awk 'BEGIN{print "<html><body><table border=1><tr><th>CVE</th><th>Package</th><th>Version</th><th>Severity</th></tr>"} {print} END{print "</table></body></html>"}' \
            > reports/generated/trivy-scan.html
        fi

        echo "✅ Scan completed for $IMAGE"
        echo "📄 Reports: reports/generated/trivy-scan.json, trivy-scan.html"

    - name: 📤 Upload Trivy Reports
      uses: actions/upload-artifact@v4
      with:
        name: trivy-scan-reports
        path: |
          reports/generated/trivy-scan.json
          reports/generated/trivy-scan.txt
          reports/generated/trivy-scan.html
