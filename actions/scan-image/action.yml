name: Scan Container Image
description: Perform vulnerability scan using Trivy on the built image artifact

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base image type (ubuntu | rhel | amazonlinux)"
    required: true

runs:
  using: "composite"
  steps:
    - name: 📥 Download built image artifact
      uses: actions/download-artifact@v4
      with:
        name: built-image
        path: reports/generated

    - name: 📂 Load Docker image
      shell: bash
      run: |
        echo "📦 Loading image into local Docker daemon..."
        docker load -i reports/generated/${{ inputs.app_name }}.tar
        docker images | grep "${{ inputs.app_name }}" || echo "⚠️ Image load failed!"

    - name: 📦 Install Trivy
      shell: bash
      run: |
        echo "📦 Installing Trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

    - name: 🚀 Run Trivy scan
      shell: bash
      run: |
        echo "🚀 Running Trivy vulnerability scan on loaded image..."
        mkdir -p reports/generated
        IMAGE="${{ inputs.app_name }}:${GITHUB_SHA}"
        trivy image --severity HIGH,CRITICAL \
          --format json \
          --output reports/generated/trivy-scan.json "$IMAGE"
        echo "✅ Scan completed: reports/generated/trivy-scan.json"

    - name: 📤 Upload Trivy report
      uses: actions/upload-artifact@v4
      with:
        name: trivy-scan-report
        path: reports/generated/trivy-scan.json
