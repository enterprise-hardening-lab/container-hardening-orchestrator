name: Generate Unified Security Report
description: Merge Trivy (image) + Semgrep (code) results into a single HTML dashboard and JSON summary

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base OS image (ubuntu | rhel | amazonlinux)"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🧩 Checkout orchestrator repo
      uses: actions/checkout@v4
      with:
        repository: enterprise-hardening-lab/container-hardening-orchestrator
        ref: main
        path: orchestrator_repo

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: 📄 Prepare environment
      shell: bash
      run: |
        mkdir -p reports/generated reports/final
        echo "${{ inputs.app_name }}" > .env.app_name
        echo "${{ inputs.base_image }}" > .env.base_image

    - name: 🧰 Generate HTML Dashboard
      shell: bash
      run: |
        python3 orchestrator_repo/orchestrator/generate_html_report.py

    - name: 📦 Upload Security Dashboard (HTML + JSON)
      uses: actions/upload-artifact@v4
      with:
        name: security-dashboard
        path: |
          reports/final/security-summary.html
          reports/final/security-summary.json
