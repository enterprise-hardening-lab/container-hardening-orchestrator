name: Container Hardening Checks
description: Run Dockerfile lint (hadolint) and policy checks (Conftest/OPA). Upload findings.

inputs:
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  policy_dir:
    description: "Path to OPA/Conftest policies"
    required: false
    default: "policies/conftest"

runs:
  using: "composite"
  steps:
    - name: 🧩 Checkout app code
      uses: actions/checkout@v4

    - name: 📦 Install hadolint
      shell: bash
      run: |
        curl -sSfL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
          -o /usr/local/bin/hadolint && chmod +x /usr/local/bin/hadolint
  

    - name: 📦 Install Conftest (dynamic latest release)
      shell: bash
      run: |
        echo "🔍 Fetching latest Conftest release..."
        LATEST_URL=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest \
          | grep "browser_download_url" \
          | grep "Linux_x86_64.tar.gz" \
          | cut -d '"' -f 4 | head -n1)
        if [ -z "$LATEST_URL" ]; then
          echo "❌ Could not detect latest Conftest release. Exiting."
          exit 1
        fi
        echo "📦 Downloading from $LATEST_URL"
        curl -sSL "$LATEST_URL" -o conftest.tar.gz
        tar -xzf conftest.tar.gz -C /usr/local/bin/ conftest
        chmod +x /usr/local/bin/conftest
        conftest --version

    - name: 🔎 Hadolint Dockerfile
      shell: bash
      run: |
        mkdir -p reports/generated
        hadolint "${{ inputs.dockerfile }}" -f json > reports/generated/hadolint.json || true
        echo "✅ hadolint completed"

    - name: 🔎 Conftest (OPA) on repo
      shell: bash
      run: |
        if [ -d "${{ inputs.policy_dir }}" ]; then
          conftest test -o json . -p "${{ inputs.policy_dir }}" > reports/generated/conftest.json || true
          echo "✅ conftest completed"
        else
          echo "{}" > reports/generated/conftest.json
          echo "ℹ️ No policy dir found at ${{ inputs.policy_dir }}, wrote empty result."
        fi

    - name: 📦 Upload hardening artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hardening-checks
        path: |
          reports/generated/hadolint.json
          reports/generated/conftest.json

