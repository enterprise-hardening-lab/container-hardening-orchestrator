name: Scan Application Source Code
description: Run Semgrep static analysis and upload SARIF as artifact (multi-repo mode)

inputs:
  language:
    description: "Primary language for Semgrep rules (e.g., python, java, javascript)"
    required: false
    default: "python"

runs:
  using: "composite"
  steps:
    # Checkout the app repository code
    - name: 🧩 Checkout code
      uses: actions/checkout@v4

    # Install Semgrep
    - name: 🧩 Install Semgrep
      shell: bash
      run: |
        echo "📦 Installing Semgrep..."
        pip install --upgrade pip >/dev/null
        pip install semgrep

    # Run Semgrep scan and generate SARIF output
    - name: 🔍 Run Semgrep Scan
      shell: bash
      run: |
        echo "🚀 Running Semgrep scan for ${{ inputs.language }}..."
        mkdir -p reports/generated
        semgrep scan --config "p/ci" --sarif --output reports/generated/semgrep-report.sarif || true
        echo "✅ Semgrep scan complete, SARIF report generated at reports/generated/semgrep-report.sarif"

    # Upload SARIF file as a downloadable artifact (no direct GitHub upload here)
    - name: 📦 Upload Semgrep Report as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: semgrep-report
        path: reports/generated/semgrep-report.sarif
