name: Notify via GitHub Issue
description: Create or update a GitHub Issue with the unified security summary

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base OS image"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🧩 Checkout app repo
      uses: actions/checkout@v4

    - name: 🔎 Read security summary
      id: read
      shell: bash
      run: |
        SUMMARY_JSON="reports/final/security-summary.json"
        if [ ! -f "$SUMMARY_JSON" ]; then
          echo "❌ $SUMMARY_JSON not found; creating placeholder."
          echo '{"trivy":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"UNKNOWN":0,"total":0},"semgrep":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"INFO":0,"total":0}}' > "$SUMMARY_JSON"
        fi

    - name: 🧮 Build issue body
      id: body
      shell: bash
      run: |
        APP="${{ inputs.app_name }}"
        BASE="${{ inputs.base_image }}"
        GEN_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        TRIVY_TOTAL=$(jq -r '.trivy.total // 0' reports/final/security-summary.json)
        SEMG_TOTAL=$(jq -r '.semgrep.total // 0' reports/final/security-summary.json)

        cat > issue.md <<'MD'
### 🔐 Security Summary — ${APP}
**Generated:** ${GEN_AT}  
**Base Image:** \`${BASE}\`

**Container (Trivy):** \`${TRIVY_TOTAL}\` total  
**Code (Semgrep):** \`${SEMG_TOTAL}\` total  

Artifacts:
- Security Dashboard (HTML/JSON) attached in workflow artifacts.
- Trivy JSON and Semgrep SARIF also available in artifacts.

> This issue is auto-generated by the Container Governance Orchestrator.
MD

    - name: 📨 Upsert GitHub Issue
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('issue.md','utf8');
          const title = `Security Summary — ${{ inputs.app_name }}`;

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open"
          });

          const existing = issues.find(i => i.title === title);

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
            core.info(`✅ Updated existing issue #${existing.number}`);
          } else {
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.info(`✅ Created issue #${created.number}`);
          }
