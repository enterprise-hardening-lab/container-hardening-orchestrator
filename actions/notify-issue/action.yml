name: Notify via GitHub Issue
description: Create or update a GitHub Issue with the unified security summary

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base OS image"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🧩 Checkout app repo
      uses: actions/checkout@v4

    - name: 🔎 Read or create security summary
      id: read
      shell: bash
      run: |
        SUMMARY_JSON="reports/final/security-summary.json"
        mkdir -p reports/final
        if [ ! -f "$SUMMARY_JSON" ]; then
          echo "⚠️ $SUMMARY_JSON not found; creating placeholder."
          echo '{"trivy":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"UNKNOWN":0,"total":0},"semgrep":{"CRITICAL":0,"HIGH":0,"MEDIUM":0,"LOW":0,"INFO":0,"total":0}}' > "$SUMMARY_JSON"
        fi
        echo "✅ Security summary ready at $SUMMARY_JSON"

    - name: 🧮 Build issue body
      id: body
      shell: bash
      run: |
        APP="${{ inputs.app_name }}"
        BASE="${{ inputs.base_image }}"
        GEN_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        TRIVY_TOTAL=$(jq -r '.trivy.total // 0' reports/final/security-summary.json)
        SEMG_TOTAL=$(jq -r '.semgrep.total // 0' reports/final/security-summary.json)

        mkdir -p reports/final
        echo "### 🔐 Security Summary — ${APP}" > reports/final/issue.md
        echo "**Generated:** ${GEN_AT}  " >> reports/final/issue.md
        echo "**Base Image:** \`${BASE}\`" >> reports/final/issue.md
        echo "" >> reports/final/issue.md
        echo "**Container (Trivy):** \`${TRIVY_TOTAL}\` total  " >> reports/final/issue.md
        echo "**Code (Semgrep):** \`${SEMG_TOTAL}\` total  " >> reports/final/issue.md
        echo "" >> reports/final/issue.md
        echo "Artifacts:" >> reports/final/issue.md
        echo "- 🧾 Security Dashboard (HTML/JSON) available in workflow artifacts." >> reports/final/issue.md
        echo "- 🧩 Trivy JSON and Semgrep SARIF also attached as artifacts." >> reports/final/issue.md
        echo "" >> reports/final/issue.md
        echo "> This issue is auto-generated by the Container Governance Orchestrator." >> reports/final/issue.md

        echo "✅ Issue body created at reports/final/issue.md"

    - name: 📨 Upsert GitHub Issue
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('reports/final/issue.md', 'utf8');
          const title = `Security Summary — ${{ inputs.app_name }}`;

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: "open"
          });

          const existing = issues.find(i => i.title === title);

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
            core.info(`✅ Updated existing issue #${existing.number}`);
          } else {
            const { data: created } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            });
            core.info(`✅ Created issue #${created.number}`);
          }
