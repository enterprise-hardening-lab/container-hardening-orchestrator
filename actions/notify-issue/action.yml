name: 📣 Notify Issue
description: Create or update GitHub Issue summarizing container and code scan results

inputs:
  app_name:
    description: "Application name"
    required: true
  personal_token:
    description: "GitHub Personal Access Token for creating issues"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🧩 Checkout repository
      uses: actions/checkout@v4

    - name: 🧾 Prepare security summary and issue body
      id: summary
      shell: bash
      run: |
        mkdir -p reports/final
        SUMMARY_JSON="reports/final/security-summary.json"
        ISSUE_BODY="reports/final/issue.md"
        APP="${{ inputs.app_name }}"
        REPO="${GITHUB_REPOSITORY}"
        RUN_ID="${GITHUB_RUN_ID}"

        # Create placeholder if missing
        if [ ! -f "$SUMMARY_JSON" ]; then
          echo '{"container_critical":0,"container_high":0,"code_high":0,"code_medium":0}' > "$SUMMARY_JSON"
        fi

        # Read metrics
        CONTAINER_CRITICAL=$(jq '.container_critical' "$SUMMARY_JSON")
        CONTAINER_HIGH=$(jq '.container_high' "$SUMMARY_JSON")
        CODE_HIGH=$(jq '.code_high' "$SUMMARY_JSON")
        CODE_MEDIUM=$(jq '.code_medium' "$SUMMARY_JSON")
        TOTAL=$((CONTAINER_CRITICAL + CONTAINER_HIGH + CODE_HIGH + CODE_MEDIUM))

        COLOR="🟢"
        if [ "$TOTAL" -gt 0 ]; then COLOR="🟠"; fi
        if [ "$TOTAL" -gt 5 ]; then COLOR="🔴"; fi

        echo "🔍 Fetching artifact metadata..."
        gh api repos/${REPO}/actions/runs/${RUN_ID}/artifacts > reports/final/artifacts.json

        # Extract artifact IDs
        TRIVY_ID=$(jq -r '.artifacts[] | select(.name=="trivy-scan-report") | .id' reports/final/artifacts.json)
        SEMGREP_ID=$(jq -r '.artifacts[] | select(.name=="semgrep-report") | .id' reports/final/artifacts.json)
        DASHBOARD_ID=$(jq -r '.artifacts[] | select(.name=="security-dashboard") | .id' reports/final/artifacts.json)

        # Build working web URLs
        BASE_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}/artifacts"
        TRIVY_URL="https://github.com/${REPO}/actions/artifacts/${TRIVY_ID}"
        SEMGREP_URL="https://github.com/${REPO}/actions/artifacts/${SEMGREP_ID}"
        DASHBOARD_URL="https://github.com/${REPO}/actions/artifacts/${DASHBOARD_ID}"

        # Fallbacks if artifact not found
        [ "$TRIVY_ID" == "null" ] && TRIVY_URL="$BASE_URL"
        [ "$SEMGREP_ID" == "null" ] && SEMGREP_URL="$BASE_URL"
        [ "$DASHBOARD_ID" == "null" ] && DASHBOARD_URL="$BASE_URL"

        {
          echo "### 🔐 Security Summary — ${APP}"
          echo "**Generated:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo
          echo "**Findings:**"
          echo "- Container: CRITICAL=${CONTAINER_CRITICAL}, HIGH=${CONTAINER_HIGH}"
          echo "- Code: HIGH=${CODE_HIGH}, MEDIUM=${CODE_MEDIUM}"
          echo
          echo "**Overall Risk:** ${COLOR} (${TOTAL} total)"
          echo
          echo "---"
          echo "**📦 Reports & Artifacts**"
          echo "- [🧾 Security Dashboard (HTML/JSON)](${DASHBOARD_URL})"
          echo "- [🧩 Trivy JSON Report](${TRIVY_URL})"
          echo "- [🧠 Semgrep SARIF Report](${SEMGREP_URL})"
          echo
          echo "> _Note: These artifact links require GitHub access and expire automatically after 90 days._"
          echo
          echo "> _This issue is auto-generated by the Container Governance Orchestrator._"
        } > "$ISSUE_BODY"

      env:
        GITHUB_TOKEN: ${{ inputs.personal_token }}

    - name: 📣 Create or Update GitHub Issue
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.personal_token }}
        script: |
          const fs = require('fs');
          const issueBody = fs.readFileSync('reports/final/issue.md', 'utf8');
          const issueTitle = `🔐 Security Summary — ${{ inputs.app_name }}`;

          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['security-summary']
          });

          const existing = issues.find(i => i.title === issueTitle);

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: issueBody
            });
            console.log(`✅ Updated existing issue #${existing.number}`);
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['security-summary']
            });
            console.log(`✅ Created new issue: ${issueTitle}`);
          }
