name: Build Container Image
description: Build container image using hardened base image

runs:
  using: "composite"
  steps:
    - name: Checkout app repository
      uses: actions/checkout@v4

    - name: Build Docker image
      shell: bash
      run: |
        echo "🏗️ Building container image for $GITHUB_REPOSITORY"
        echo "Base image: 661539128717.dkr.ecr.ap-south-1.amazonaws.com/hardened-ubuntu:ubuntu-22.04-cis1.4-20251107170841-6cbd6dc"

        # Simulate build process for demo (replace with docker build later)
        mkdir -p reports/generated
        echo "Image build completed at $(date)" > reports/generated/build-summary.txt

    - name: Upload build summary
      uses: actions/upload-artifact@v4
      with:
        name: build-summary
        path: reports/generated/build-summary.txt
