name: Build Container Image
description: Build the application container using the hardened base image

inputs:
  app_name:
    description: "Application name"
    required: true
  base_image:
    description: "Base OS image used for build (ubuntu | rhel | amazonlinux)"
    required: true
  role-to-assume:
    description: "IAM role ARN for GitHub OIDC"
    required: true
  aws-region:
    description: "AWS region for ECR authentication"
    required: true

runs:
  using: "composite"
  steps:
    - name: 🧱 Checkout application repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository }}
        ref: ${{ github.ref }}

    - name: 🔐 Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: 🔑 Authenticate to ECR
      shell: bash
      run: |
        echo "🔑 Logging in to ECR..."
        aws ecr get-login-password --region "${{ inputs.aws-region }}" \
          | docker login --username AWS --password-stdin 661539128717.dkr.ecr.ap-south-1.amazonaws.com

    - name: 🧱 Prepare Docker build context
      shell: bash
      run: |
        echo "🔧 Preparing Docker build context..."
        echo "APP_NAME=${{ inputs.app_name }}"
        echo "BASE_IMAGE=${{ inputs.base_image }}"
        mkdir -p reports/generated

    - name: 🧰 Build image from hardened base
      shell: bash
      run: |
        set -e
        TAG="${GITHUB_SHA}"
        IMAGE="${{ inputs.app_name }}:${TAG}"
        BASE_IMAGE_PATH="661539128717.dkr.ecr.ap-south-1.amazonaws.com/hardened-${{ inputs.base_image }}:ubuntu-22.04-cis1.4-20251107170841-6cbd6dc"

        echo "🚀 Building local image: $IMAGE"
        echo "🧩 Using hardened base: $BASE_IMAGE_PATH"

        DOCKER_BUILDKIT=1 docker build \
          --progress=plain \
          --build-arg BASE_IMAGE=$BASE_IMAGE_PATH \
          -t "$IMAGE" . | tee reports/generated/docker-build.log

        echo "✅ Successfully built local image: $IMAGE"
        echo "📄 Build log saved to reports/generated/docker-build.log"

    - name: 📤 Upload Build Metadata
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: reports/generated/docker-build.log
